<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Prove-am">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Prove-am</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:9999}
    #boot span{font-size:28px;font-weight:700;letter-spacing:-.5px;color:#111}
    @media (prefers-reduced-motion:no-preference){
      #boot span{animation:bootPulse 1.1s ease-in-out infinite}
      @keyframes bootPulse{0%,100%{opacity:.45;transform:scale(.98)}50%{opacity:1;transform:scale(1)}}
    }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading Prove-am"><span>Prove-am</span></div>
  <noscript>Prove-am requires JavaScript.</noscript>
  <script>
    window.addEventListener("load",function(){
      setTimeout(function(){
        var b=document.getElementById("boot");
        if(b)b.remove();
      },350);
    });
  </script>
</body>
</html>
